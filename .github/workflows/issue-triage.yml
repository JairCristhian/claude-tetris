name: Análisis y triage de issues

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Ignorar PRs y actores bot para evitar bucles infinitos
    if: |
      !github.event.issue.pull_request &&
      github.actor != 'github-actions[bot]' &&
      !endsWith(github.actor, '[bot]')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Analizar issue y asignar labels
        id: analyze
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true

          prompt: |
            ## Tarea: Analizar y hacer triage de un issue

            **Repositorio:** ${{ github.repository }}
            **Issue:** #${{ github.event.issue.number }}
            **Acción:** ${{ github.event.action }}

            ### Instrucciones

            1. **Leer el issue completo:**
               ```bash
               gh issue view ${{ github.event.issue.number }} --json title,body,labels,author
               ```

            2. **Leer el código del proyecto:** Revisa los archivos clave del juego Tetris:
               - `game.js` (lógica del juego)
               - `index.html` (estructura y UI)
               - `style.css` (estilos)
               - `CLAUDE.md` (arquitectura y guía de desarrollo)

            3. **Gestionar labels:**
               - Primero, ejecuta `gh label list` para ver los labels existentes.
               - Crea los labels base necesarios (si no existen):
                 ```bash
                 gh label create "bug" --force --description "Defectos en el código"
                 gh label create "enhancement" --force --description "Mejoras y nuevas características"
                 gh label create "question" --force --description "Preguntas sobre el proyecto"
                 gh label create "documentation" --force --description "Mejoras en la documentación"
                 gh label create "gameplay" --force --description "Mecánicas y lógica del juego"
                 gh label create "ui" --force --description "Interfaz de usuario"
                 gh label create "performance" --force --description "Rendimiento y optimización"
                 gh label create "prioridad:alta" --force --description "Prioridad alta"
                 gh label create "prioridad:media" --force --description "Prioridad media"
                 gh label create "prioridad:baja" --force --description "Prioridad baja"
                 ```
               - Asigna los labels apropiados al issue:
                 ```bash
                 gh issue edit ${{ github.event.issue.number }} --add-label "label1,label2,label3"
                 ```

            4. **Crear o actualizar diagnóstico:**
               - Busca si existe un comentario con el marcador `<!-- claude-issue-triage -->`:
                 ```bash
                 gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments --jq '.[] | select(.body | contains("claude-issue-triage")) | .id' | head -1
                 ```
               - Si existe un comentario, actualízalo:
                 ```bash
                 gh api -X PATCH repos/${{ github.repository }}/issues/comments/<COMMENT_ID> -F body=@/tmp/triage.md
                 ```
               - Si NO existe, crea uno nuevo:
                 ```bash
                 gh issue comment ${{ github.event.issue.number }} --body-file /tmp/triage.md
                 ```

            5. **Contenido del diagnóstico (guardar en /tmp/triage.md):**
               El formato debe ser en español:
               ```markdown
               <!-- claude-issue-triage -->

               ## 🔍 Diagnóstico

               [Resumen breve del problema en 2-3 líneas]

               ### Tipo y Prioridad
               | Campo | Valor |
               |-------|-------|
               | **Tipo** | bug/enhancement/question/documentation/etc |
               | **Prioridad** | alta/media/baja |
               | **Área Afectada** | gameplay/ui/performance/rendering/controls/scoring/etc |

               ### Causa Probable
               [Descripción técnica de la causa raíz, con referencias a:
                - Archivos específicos: `game.js`, `index.html`, `style.css`
                - Funciones/variables: `función()`, `variable`
                - Números de línea aproximados si es relevante]

               ### Plan de Implementación
               - [ ] Paso 1: [descripción breve]
               - [ ] Paso 2: [descripción breve]
               - [ ] Paso 3: [descripción breve]
               (máximo 5 pasos claros y ejecutables)

               ### Criterios de Aceptación
               - El cambio debe cumplir con...
               - Se debe verificar que...
               - La funcionalidad debe...

               ### Notas y Preguntas Abiertas
               - [Riesgo 1 o aspecto indefinido]
               - [Riesgo 2 o información faltante]
               - [Pregunta para el implementador]

               ---
               *Diagnóstico generado automáticamente por Claude* 🤖
               ```

            6. **Restricciones finales:**
               - NO modifiques archivos de código del repositorio.
               - NO crees pull requests ni branches.
               - NO inventes información: si algo es ambiguo o desconocido, indícalo en "Notas y Preguntas Abiertas".
               - Sé conciso, claro y útil para el implementador.

          claude_args: '--allowed-tools "Bash(gh issue:*),Bash(gh label:*),Bash(gh api:*),Read,Write,Glob" --max-turns 15'
