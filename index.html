<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">TIME</span>
          <span class="value" id="time">00:00</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">TEMA</span>
          <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">
            <span class="switch" aria-hidden="true"></span>
            <span id="theme-text">Oscuro</span>
          </button>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="gameover-extra" class="gameover-extra hidden">
          <div id="name-form" class="name-form hidden">
            <span class="label">NOMBRE</span>
            <div class="name-row">
              <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
              <button id="save-record-btn" class="primary-btn" type="button">Guardar</button>
            </div>
          </div>
          <div id="gameover-records" class="records"></div>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p class="overlay-heading">RECORDS</p>
        <div id="start-records" class="records"></div>
        <button id="start-btn" class="primary-btn" type="button">Jugar</button>
        <button id="reset-records-btn" class="link-btn" type="button">Resetear records</button>
      </div>
    </div>
  </div>
  </main>

  <script src="records.js"></script>
  <script src="game.js"></script>
</body>
</html>
